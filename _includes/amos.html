<style>
  /* Sized like any other image on the page: the site stylesheet gives img
     width:100%, so the player takes the same width and the same aspect as
     the picture it replaces. Someone with JavaScript and someone without
     then get a page of identical shape — the player is what the poster
     becomes when you click it, not a differently-sized thing that shoves
     the article around. The aspect is copied off the real image at run
     time; this is only the fallback for a picture that has not loaded. */
  .amos-embed {
    position: relative;
    width: 100%;
    aspect-ratio: 320 / 256;
    margin: 0;
    background: #000;
    line-height: 0;
  }
  /* The player draws the whole PAL overscan window. object-fit keeps it
     undistorted inside whatever shape the poster set, letterboxing rather
     than stretching a 320x256 game to fit. */
  .amos-embed > canvas,
  .amos-embed > .amos-poster {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .amos-embed .amos-play {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font: inherit; font-size: 2rem; color: #fff; cursor: pointer;
    background: rgba(0,0,0,.45); border: 0; line-height: 1;
  }
  .amos-embed .amos-play:hover { background: rgba(0,0,0,.2); }
  .amos-embed .amos-note {
    position: absolute; left: 0; right: 0; bottom: 0;
    font: 12px monospace; line-height: 1.4; color: #ccc;
    background: rgba(0,0,0,.6); padding: 2px 6px; text-align: center;
  }
  /* the only cue that the player has taken the keyboard */
  .amos-embed.amos-focus { outline: 2px solid #fa0; }
</style>

<script type="module">
  import { replaceImages } from "/assets/js/replaceImages.js";

  // The player is versioned by path, so pinning is a one-line change here.
  // /v/latest/ picks up improvements; /v/0.3.0/ would stay put forever.
  const PLAYER = "https://amos.bitplane.net/v/latest/assets/amos-player.js";

  /**
   * Nothing is fetched until the reader asks for it. The player is ~820 kB
   * and a game zip can be most of a megabyte, which is not a thing to spend
   * on everyone who scrolls past a post. So the poster stays the poster and
   * the module is dynamically imported on the click that starts it — a click
   * needed anyway, because browsers will not start audio without a gesture
   * and a page with two games should not run both at once.
   */
  document.addEventListener("DOMContentLoaded", () => {
    replaceImages("amos", (zipName, img) => {
      const box = document.createElement("div");
      box.className = "amos-embed";

      // the poster is the picture the markdown already had, at the size the
      // page would have given it; the player inherits that box exactly
      const poster = img.cloneNode();
      poster.className = "amos-poster";
      poster.removeAttribute("alt");
      const fitBox = () => {
        const w = poster.naturalWidth, h = poster.naturalHeight;
        if (w && h) box.style.aspectRatio = `${w} / ${h}`;
      };
      poster.complete ? fitBox() : poster.addEventListener("load", fitBox, { once: true });
      box.appendChild(poster);

      const play = document.createElement("button");
      play.type = "button";
      play.className = "amos-play";
      play.textContent = "▶ play";
      play.title = "Runs in your browser — no emulator, no Kickstart ROM";
      box.appendChild(play);

      const note = (text) => {
        let el = box.querySelector(".amos-note");
        if (!el) {
          el = document.createElement("div");
          el.className = "amos-note";
          box.appendChild(el);
        }
        el.textContent = text;
      };

      play.addEventListener("click", async () => {
        play.disabled = true;
        note("loading…");
        try {
          // "amos:/eggit.amos.zip" names a file sitting beside the post, so
          // a leading slash is the author writing a path, not a site-root URL
          const url = new URL(zipName.replace(/^\//, ""), location.href);
          const [{ createPlayer }, zip] = await Promise.all([
            import(PLAYER),
            fetch(url).then((r) => {
              if (!r.ok) throw new Error(`${r.status} fetching ${url.pathname}`);
              return r.arrayBuffer();
            }),
          ]);
          poster.remove();
          play.remove();
          const player = createPlayer(box, {
            // nearly every AMOS game reads Joy(1) and nothing else — eggit
            // polls Jup(1)/Jleft(1)/Jright(1)/Fire(1) and never the keyboard
            joystick: { port1: "arrows" },
            autoplay: true, // the click WAS the gesture
            onError: (m) => note(`error: ${m}`),
          });
          await player.loadArchive(new Uint8Array(zip), url.pathname.split("/").pop());
          player.focus();
          note("arrows + space · click to play, click away to give the keys back");
        } catch (e) {
          play.disabled = false;
          note(`could not start: ${e.message}`);
          console.error("amos-ts:", e);
        }
      });

      return box;
    });
  });
</script>
